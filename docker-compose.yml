# Sobe o ambiente completo com um comando:  docker compose up --build
#
# `depends_on: condition: service_healthy` e o detalhe que importa: sem ele o Docker
# considera "pronto" um container que apenas *iniciou*, e a API tenta conectar no
# Postgres antes dele aceitar conexoes. Com healthcheck, a ordem de boot e real.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    # appendonly: persiste a fila do worker entre restarts, para nao perder jobs.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Mesma imagem da API, comando diferente. Worker e API compartilham models, services e o
  # modulo de cache; imagens separadas dariam duas versoes do mesmo codigo convivendo, e a
  # divergencia apareceria como bug de dado (ADR 0008).
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["arq", "app.workers.settings.WorkerSettings"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # O proprio arq publica um health check no Redis; `--check` le esse registro e sai
      # com codigo 1 se o worker parou de bater o ponto.
      test: ["CMD", "arq", "--check", "app.workers.settings.WorkerSettings"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # nginx servindo o build estático e fazendo proxy de /api para a API. O front nunca
  # sabe o endereço real da API, então não há URL embutida no build nem CORS para liberar.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
