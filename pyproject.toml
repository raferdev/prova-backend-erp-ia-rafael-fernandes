[project]
name = "prova-backend-erp-ia"
version = "0.1.0"
description = "ERP - modulo de Pedidos e Estoque (prova tecnica back-end IA)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    "httpx>=0.28.0",
    # OAuth2PasswordRequestForm recebe form-urlencoded, que o Starlette so parseia com isto.
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Ruff substitui black + isort + flake8 + autoflake num binario so. O objetivo e tirar
# formatacao e ordem de import da revisao de codigo, sobrando so regra de negocio.
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort (ordem de imports)
    "B",   # flake8-bugbear (armadilhas comuns)
    "UP",  # pyupgrade (sintaxe moderna de Python)
    "ASYNC",  # flake8-async: pega chamada bloqueante dentro de funcao async
    "C4",  # comprehensions
    "SIM", # simplificacoes
]
ignore = [
    "B008",  # chamada de funcao no default do argumento: e o idioma do Depends() do FastAPI
]

[tool.ruff.lint.per-file-ignores]
# Os testes precisam definir env vars antes dos imports da aplicacao (ver conftest.py).
"app/tests/conftest.py" = ["E402"]
