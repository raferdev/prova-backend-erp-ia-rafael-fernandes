server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O front chama sempre `/api/...` relativo, e é aqui que o caminho vira a API de
    # verdade. É o que dispensa CORS: para o navegador, tudo sai da mesma origem.
    #
    # A barra final em `proxy_pass` remove o prefixo `/api`, espelhando o `rewrite` que o
    # Vite faz no desenvolvimento. Sem ela, a API receberia `/api/produtos` e devolveria 404.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota desconhecida devolve o index, e o roteamento acontece no cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets levam hash no nome, então podem ser cacheados agressivamente. O index.html
    # não: ele é quem aponta para o hash novo depois de um deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
